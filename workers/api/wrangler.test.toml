name = "omg-saas-test"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]
send_email = [{ name = "EMAIL" }]

# Test bindings are local-only. Workers AI is intentionally absent because it has
# no local simulator and would otherwise make the unit suite call a paid remote API.
[[d1_databases]]
binding = "DB"
database_name = "omg-licensing-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "omg-assets-test"

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "9001"
simple = { limit = 10000, period = 60 }

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "9002"
simple = { limit = 10000, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "9003"
simple = { limit = 10000, period = 60 }

[[ratelimits]]
name = "OFFER_RATE_LIMITER"
namespace_id = "9004"
simple = { limit = 10000, period = 60 }

[vars]
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
STRIPE_PRO_PRICE_ID = "price_test_pro"
STRIPE_TEAM_PRICE_ID = "price_test_team"
