name = "omg-releases"
main = "src/index.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
persist = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "omg-releases"
preview_bucket_name = "omg-releases-preview"

[env.production]
route = { pattern = "releases.pyro1121.com/*", zone_name = "pyro1121.com" }

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "omg-releases"
