name = "omg-router"
main = "src/index.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]

# Routes - attach to pyro1121.com
routes = [
  { pattern = "pyro1121.com/docs/*", zone_name = "pyro1121.com" },
  { pattern = "pyro1121.com/docs", zone_name = "pyro1121.com" }
]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
persist = true

[vars]
MAIN_SITE = "https://omg-site-4gd.pages.dev"
# The Pages docs origin is retired; /docs/ is served by the omg-site Worker.
DOCS_SITE = "https://omg.latham.cloud"
