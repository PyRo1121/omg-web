name = "omg-site"
compatibility_date = "2026-08-21"

# Cloudflare Pages configuration
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
persist = true

# D1 Database for Better Auth
[[d1_databases]]
binding = "DB"
database_name = "omg-auth-db"
database_id = "871b70ca-79f7-4bb0-bfba-0f9f9aca4de9"

# Private licensing API calls from the same-origin BFF
[[services]]
binding = "LICENSING_API"
service = "omg-saas"