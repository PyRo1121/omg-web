name = "omg-site"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets replaces the retired Pages project. Static asset
# requests are free; only SSR/API requests invoke the paid Worker script.
# dist/_headers and dist/_redirects are honored by Workers Static Assets.
# The production custom domain is the only entry point; the workers.dev
# subdomain would be an unmonitored duplicate surface.
workers_dev = false

routes = [{ pattern = "omg.latham.cloud", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
persist = true

# Shared physical D1 database. Better Auth owns only its four auth tables.
[[d1_databases]]
binding = "DB"
database_name = "omg-platform"
database_id = "fee8ddab-fb4a-4be4-b8d2-8abb7c2db188"

# Private licensing API calls from the same-origin BFF
[[services]]
binding = "LICENSING_API"
service = "omg-saas"
