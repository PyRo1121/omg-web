name = "omg-saas"
main = "src/worker.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"] # Required for Sentry SDK

# Custom domain routes
routes = [{ pattern = "api.pyro1121.com/*", zone_name = "pyro1121.com" }]

# D1 Databases
[[d1_databases]]
binding = "DB"
database_name = "omg-licensing"
database_id = "bcaf7781-a747-4637-92d9-94782e4fa1db"
migrations_dir = "migrations"

# R2 Buckets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "omg-assets"

[ai]
binding = "AI"

# Rate limiting for admin API (100 requests per minute per user)
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Rate limiting for auth API (10 requests per minute per IP - brute force protection)
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Rate limiting for telemetry API (100 events per minute per license)
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 100, period = 60 }

# Secrets are set via: npx wrangler secret put <NAME>
# Required: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, JWT_SECRET, ADMIN_USER_ID, RESEND_API_KEY, META_API_KEY
# Optional: TURNSTILE_SECRET_KEY, SENTRY_DSN

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
persist = true

[placement]
mode = "smart"

[vars]
STRIPE_PRO_PRICE_ID = "price_1SqWTHEFWzXv59QZC5zBGdLg"
STRIPE_TEAM_PRICE_ID = "price_1SqWTXEFWzXv59QZB5G51MOV"

[triggers]
crons = ["0 2 * * *"]
