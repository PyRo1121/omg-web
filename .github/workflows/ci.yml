name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a merged PR must not keep running its pull_request job
# alongside the push job, racing on shared npm caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            site/workers/package-lock.json
            workers/router/package-lock.json
      # Honor the packageManager pin from package.json instead of the runner's stock npm.
      - run: corepack enable npm && npm --version
      - run: npm ci
      - run: npm ci --prefix site
      - run: npm ci --prefix site/workers
      - run: npm ci --prefix workers/router
      # Fail fast on cheap deterministic gates before paying for a production build.
      - run: npm run check
      - run: npm run build:check --prefix site

  e2e-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: corepack enable npm && npm --version
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e:anonymous
        working-directory: site
      # This job must stay anonymous-only: traces/videos from authenticated
      # specs would land in downloadable artifacts. Run staging specs elsewhere.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7
