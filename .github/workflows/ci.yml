name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a merged PR must not keep running its pull_request job
# alongside the push job, racing on shared npm caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            site-svelte/package-lock.json
            workers/api/package-lock.json
            workers/router/package-lock.json
            workers/releases/package-lock.json
      # Honor the packageManager pin from package.json instead of the runner's stock npm.
      - run: corepack enable npm && npm --version
      - run: npm ci
      - run: npm ci --prefix site
      - run: npm ci --prefix site-svelte
      - run: npm ci --prefix workers/api
      - run: npm ci --prefix workers/router
      - run: npm ci --prefix workers/releases
      # The deploy dry-run inside check builds the site after cheap deterministic gates.
      - run: npm run check
      - run: npm run check:bundle-budget --prefix site

  e2e-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-svelte/package-lock.json
      - run: npm ci
        working-directory: site-svelte
      - run: corepack enable npm && npm --version
        working-directory: site-svelte
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: site-svelte
      - run: npm run test:e2e:public
        working-directory: site-svelte
      # This job stays public and local: authenticated specs require a bound
      # deployment and their traces must never become downloadable artifacts.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            site-svelte/playwright-report
            site-svelte/test-results
          if-no-files-found: ignore
          retention-days: 7
