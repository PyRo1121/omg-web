name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a merged PR must not keep running its pull_request job
# alongside the push job, racing on shared npm caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            workers/api/package-lock.json
      # Honor the packageManager pin from package.json instead of the runner's stock npm.
      - run: corepack enable npm && npm --version
      - name: Install root dependencies
        run: |
          output="$(npm ci --audit=true 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'found 0 vulnerabilities' <<<"$output"
      - name: Install site dependencies
        run: |
          output="$(npm ci --audit=true --prefix site 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'found 0 vulnerabilities' <<<"$output"
      - name: Install Worker dependencies
        run: |
          output="$(npm ci --audit=true --prefix workers/api 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'found 0 vulnerabilities' <<<"$output"
      # The deploy dry-run inside check builds the site after cheap deterministic gates.
      - run: npm run check
        env:
          NPM_CONFIG_OFFLINE: true

  e2e-anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --audit=false
        working-directory: site
      - run: corepack enable npm && npm --version
        working-directory: site
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e:public
        working-directory: site
      # This job stays public and local: authenticated specs require a bound
      # deployment and their traces must never become downloadable artifacts.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            site/playwright-report
            site/test-results
          if-no-files-found: ignore
          retention-days: 7
